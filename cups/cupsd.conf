LogLevel warn
MaxLogSize 0
Listen 0.0.0.0:631
Browsing Off
ServerAlias *

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow all
</Location>

<Policy default>
  <Limit All>
    Order allow,deny
    Allow all
  </Limit>
</Policy>
