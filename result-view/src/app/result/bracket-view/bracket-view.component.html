<div class="bracket" [style.height.px]="bracketHeight" [style.width.px]="bracketWidth">
  <div *ngFor="let round of rounds; let r = index" class="round" [style.left.px]="r * roundWidth">
    <div class="stage-title">{{ names[r] }}</div>
    <div class="round-matches" [style.height.px]="matchAreaHeight">
      <div *ngFor="let entry of round" class="match" [style.top.px]="entry.top">
        <div class="match-content">
          <div class="team">
            <span>{{ teamLabel(entry.match.team1) }}</span>
            <span class="score">{{ entry.match.result | resultPipe: true }}</span>
          </div>
          <hr />
          <div class="team">
            <span>{{ teamLabel(entry.match.team2) }}</span>
            <span class="score">{{ entry.match.result | resultPipe: false }}</span>
          </div>
        </div>
        <div *ngIf="entry.hasIncoming" class="line line-incoming"></div>
        <div *ngIf="entry.hasOutgoing" class="line line-outgoing"></div>
        <div *ngIf="entry.vertical" class="line line-vertical" [style.top.px]="entry.vertical.top" [style.height.px]="entry.vertical.height"></div>
      </div>
    </div>
  </div>
</div>
