<mat-toolbar color="primary">
  <mat-toolbar-row>
    <h1>Turnier Ergebnisse</h1>
    <span class="spacer"></span>
    <mat-checkbox [(ngModel)]="apiVersionV2" (change)="onApiVersionChange()">v2 API (experimentell)</mat-checkbox>
  </mat-toolbar-row>
</mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav #sidenav>
    <mat-nav-list>
      <a
        *ngFor="let manager of disciplines"
        routerLinkActive="active"
        mat-list-item
        [routerLink]="'/tablemanager/' + manager"
        (click)="sidenav.toggle()"
      >
        Manager {{ manager }}
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
