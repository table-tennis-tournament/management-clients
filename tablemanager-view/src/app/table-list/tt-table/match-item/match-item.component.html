<div class="row">
  @for (side of [match.players_a, match.players_b]; track $index) {
    <div class="col-6">
      <span matBadge="{{ highestCall(side) }}" [matBadgeHidden]="highestCall(side) < 2" matBadgeColor="warn" matBadgeOverlap="false">
        {{ side | playerName }}
      </span>
    </div>
  }
</div>
@if (waitingMinutes() !== null) {
  <div class="call-info">
    Erster Aufruf vor {{ waitingMinutes() }} min
    @if (match.requestedCallNumber) {
      · {{ match.requestedCallNumber }}. Aufruf angefordert
    }
  </div>
}
<div class="d-flex justify-content-between w-100">
  <button mat-mini-fab color="accent" [disabled]="!canCall()" (click)="callPlayers()" aria-label="Spieler ausrufen">
    <mat-icon aria-hidden="false">alarm</mat-icon>
  </button>

  <button mat-mini-fab color="warn" (click)="startMatch.emit(match.match_id)" class="float-right">
    <mat-icon aria-hidden="false">play_arrow</mat-icon>
  </button>
</div>
