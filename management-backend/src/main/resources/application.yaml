spring:
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  application:
    name: management-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

springdoc:
  swagger-ui:
    path: /api-docs-ui
  api-docs:
    path: /v3/api-docs

management:
  # Health (spec/07_backend_modular_monolith.md, "Health and readiness"). In production port 8080 is internal: nginx
  # only proxies /readyz to it, so the details stay inside the hall's network.
  health:
    db:
      # replaced by the health module's time-boxed `db` check
      enabled: false
  endpoint:
    health:
      show-details: always
      probes:
        # /actuator/health/liveness and /readiness, also served as /livez and /readyz
        enabled: true
        add-additional-paths: true
      group:
        # the process runs; a failing database does not restart it
        liveness:
          include: livenessState
        # ready for the clients: database, mktt's tables, Flyway's tables and the WebSocket
        readiness:
          include: readinessState, db, mkttSchema, flyway, webSocket
  printer:
    default-name: ${DEFAULT_PRINTER:PDF}
