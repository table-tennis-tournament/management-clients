# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            admin-view/package-lock.json
            result-view/package-lock.json
            tablemanager-view/package-lock.json

      - name: admin-view - Install & Format Check
        run: |
          cd admin-view
          npm ci
          npm run format:check

      - name: result-view - Install & Format Check
        run: |
          cd result-view
          npm ci
          npm run format:check

      - name: tablemanager-view - Install & Format Check
        run: |
          cd tablemanager-view
          npm ci
          npm run format:check

  # This workflow contains a single job called "build"
  build:
    needs: lint-and-format
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: holzleube/ttt-clients
          tags: |
              type=sha,enable=true,priority=100,prefix=,suffix=,format=long
              type=ref,event=tag
      - name: Build and push Docker images
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: ./
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./Dockerfile-clients

  e2e-tablemanager:
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: tablemanager-view/package-lock.json
      - name: Install dependencies
        working-directory: tablemanager-view
        run: npm ci
      - name: Get Playwright version
        id: playwright-version
        working-directory: tablemanager-view
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Browsers
        working-directory: tablemanager-view
        run: npx playwright install --with-deps chromium
      - name: Start services with Docker Compose
        run: docker compose up -d
      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:9000/api/tables?table_manager=1 > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend..."
            sleep 5
          done
      - name: Run Playwright tests
        working-directory: tablemanager-view
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-tablemanager
          path: tablemanager-view/playwright-report/
          retention-days: 30

  e2e-resultview:
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: result-view/package-lock.json
      - name: Install dependencies
        working-directory: result-view
        run: npm ci
      - name: Get Playwright version
        id: playwright-version
        working-directory: result-view
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Browsers
        working-directory: result-view
        run: npx playwright install --with-deps chromium
      - name: Start services with Docker Compose
        run: docker compose up -d
      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:9000/api/tables?table_manager=1 > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend..."
            sleep 5
          done
      - name: Run Playwright tests
        working-directory: result-view
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-resultview
          path: result-view/playwright-report/
          retention-days: 30
