worker_processes auto; # Optimization

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream management_backend {
        server management-backend:8080;
    }

    server {
        listen 8080;
        server_name localhost;

        # The container's :8080 is published as :80 on the host, so nginx must
        # not bake its own listen port into redirect Location headers.
        absolute_redirect off;

        # =========================================================
        # 1. v2 API (management-backend)
        # =========================================================
        location /api/v2/ {
            proxy_pass http://management_backend/api/v2/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # v2 WebSocket endpoint (STOMP)
        location /ttt-websocket {
            proxy_pass http://management_backend/ttt-websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # =========================================================
        # 2. Health
        # =========================================================

        # nginx itself runs and serves (the container's healthcheck): no backend involved
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        # the whole system is ready: the backend's readiness group (database, mktt's tables,
        # Flyway, WebSocket) as seen through this proxy; 503 if any of them, or the backend, is down
        location = /readyz {
            access_log off;
            proxy_pass http://management_backend/readyz;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_set_header Host $host;
            error_page 502 504 = @backend_unavailable;
        }

        location @backend_unavailable {
            default_type application/json;
            return 503 '{"status":"DOWN","components":{"managementBackend":{"status":"DOWN","details":{"error":"backend not reachable"}}}}';
        }

        # =========================================================
        # 3. Angular Apps (Static Files)
        # =========================================================

        location /admin-view {
            alias /usr/share/nginx/html/admin-view;
            try_files $uri $uri/ /admin-view/index.html;
        }

        location /tablemanager-view {
            alias /usr/share/nginx/html/tablemanager-view;
            try_files $uri $uri/ /tablemanager-view/index.html;
        }

        location /result-view {
            alias /usr/share/nginx/html/result-view;
            try_files $uri $uri/ /result-view/index.html;
        }

        location = / {
            return 301 /admin-view/;
        }
    }
}
