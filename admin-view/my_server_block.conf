server {
    listen  8080;
    gzip_types *;
    root /app;

    location /api/v2 {
        proxy_pass http://management-backend:8080;
        proxy_redirect off;
        proxy_set_header Host $host;
    }

    location /ttt-websocket {
        proxy_pass http://management-backend:8080;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
